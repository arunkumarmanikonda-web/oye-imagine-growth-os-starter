name: next16-normalize-client-directives

on:
  push:
    branches:
      - agent/next16-security-upgrade

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[next16-directives]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next16-security-upgrade
      - name: Normalize use-client directives
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('src')]
          changed = []
          for root in roots:
              for path in list(root.rglob('*.ts')) + list(root.rglob('*.tsx')):
                  text = path.read_text(encoding='utf-8-sig')
                  lines = text.splitlines()
                  idx = next((i for i, line in enumerate(lines) if line.strip() in {'"use client";', "'use client';", '"use client"', "'use client'"}), None)
                  if idx is None:
                      continue
                  directive = lines[idx].strip()
                  canonical = "'use client'"
                  if idx == 0 and lines[0].strip() in {canonical, canonical + ';'}:
                      continue
                  del lines[idx]
                  while lines and lines[0] == '':
                      lines.pop(0)
                  lines.insert(0, canonical)
                  lines.insert(1, '')
                  path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')
                  changed.append(str(path))
          print('Normalized', len(changed), 'files')
          for item in changed:
              print(item)
          PY
      - name: Commit normalized directives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Normalize client directives for Next 16 [next16-directives]" || exit 0
          git push origin HEAD:agent/next16-security-upgrade
