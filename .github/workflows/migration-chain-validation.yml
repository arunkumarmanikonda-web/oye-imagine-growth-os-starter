name: migration-chain-validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-chain-validation.yml'
      - 'scripts/validate-migration-chain.sh'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migration chain in disposable PostgreSQL
        run: bash scripts/validate-migration-chain.sh
      - name: Upload migration validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-logs
          path: |
            /tmp/migration-*.log
            /tmp/migration-summary.md
          if-no-files-found: ignore
          retention-days: 2
