name: diagnose-production-activation

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: commercial evidence panel
        run: npx vitest run tests/lib/admin-ops-commercial-evidence-panel.test.tsx
      - name: operator action bridge panel
        run: npx vitest run tests/lib/admin-ops-operator-action-bridge-panel.test.tsx
      - name: admin runtime page
        run: npx vitest run tests/lib/admin-runtime-page.test.ts
      - name: admin release status route
        run: npx vitest run tests/lib/admin-release-status-route.test.ts
      - name: commercial evidence bridge
        run: npx vitest run tests/lib/commercial-evidence-bridge.test.ts
      - name: activation production suite
        run: npm run test:activation-production-suite
      - name: full validation suite
        run: npm run test:validation-full-suite
