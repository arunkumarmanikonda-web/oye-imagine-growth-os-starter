name: diagnose-production-activation

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: admin ops release surfaces
        run: npm run test:admin-ops-release-surfaces
      - name: activation production suite
        run: npm run test:activation-production-suite
      - name: full validation suite
        run: npm run test:validation-full-suite
