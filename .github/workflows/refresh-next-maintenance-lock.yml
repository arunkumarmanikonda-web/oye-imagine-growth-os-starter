name: Refresh Next maintenance lockfile

on:
  push:
    branches:
      - agent/launch-homepage-commercial-clarity

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'security dependency baseline') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-homepage-commercial-clarity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh supported security baseline
        run: |
          npm install next@15.5.22 --save
          npm install vitest@4.1.10 --save-dev
          npm audit fix || true
      - name: Prove build and test runner
        run: |
          npm run build
          npx vitest run tests/lib/foundation-public-shell.test.ts tests/lib/foundation-cms-controller.test.ts
      - name: Record dependency audit
        run: npm audit --json > dependency-audit.json || true
      - name: Commit generated package metadata
        run: |
          git config user.name "oye-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json dependency-audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: security dependency baseline"
          git push origin HEAD:agent/launch-homepage-commercial-clarity
