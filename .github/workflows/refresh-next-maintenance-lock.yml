name: Refresh Next maintenance lockfile

on:
  push:
    branches:
      - agent/launch-homepage-commercial-clarity

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore: lock Next.js 15.5.22') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-homepage-commercial-clarity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh Next.js maintenance release
        run: npm install next@15.5.22 --save
      - name: Record dependency audit
        run: npm audit --json > dependency-audit.json || true
      - name: Commit generated package metadata
        run: |
          git config user.name "oye-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json dependency-audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock Next.js 15.5.22 maintenance release"
          git push origin HEAD:agent/launch-homepage-commercial-clarity
