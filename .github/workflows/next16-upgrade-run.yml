name: next16-upgrade-run

on:
  push:
    branches:
      - agent/next16-security-upgrade

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[next16-upgrade]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next16-security-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade dependencies
        run: |
          npm install next@16.3.0 react@19.2.8 react-dom@19.2.8
          npm install --save-dev @types/react@latest @types/react-dom@latest
      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next and React dependencies [next16-upgrade]" || exit 0
          git push origin HEAD:agent/next16-security-upgrade
