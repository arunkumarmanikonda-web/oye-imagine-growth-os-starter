name: release-governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate static schema contract
        run: node scripts/verify-production-schema-contract.mjs
      - name: Generate release manifest
        run: node scripts/generate-release-manifest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: oye-release-manifest
          path: public/release-manifest.json
          retention-days: 30
