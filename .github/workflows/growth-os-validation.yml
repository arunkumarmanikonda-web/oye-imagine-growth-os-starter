name: growth-os-validation

on:
  push:
    branches:
      - main
      - 'batch/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase migration parity baseline
        run: node scripts/verify-supabase-parity-snapshot.mjs

      - name: Verify final Supabase migration parity closure
        run: node scripts/verify-final-supabase-parity-snapshot.mjs

      - name: Verify admin AAL2 coverage
        run: node scripts/verify-admin-aal2-coverage.mjs

      - name: Verify CSP telemetry privacy contract
        run: node scripts/verify-csp-telemetry-contract.mjs

      - name: Verify release readiness truth contract
        run: node scripts/verify-release-readiness-contract.mjs

      - name: Run validation suite
        shell: pwsh
        run: ./scripts/Invoke-GrowthOsValidation.ps1
