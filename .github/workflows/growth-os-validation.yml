name: growth-os-validation

on:
  push:
    branches:
      - main
      - 'batch/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite
        shell: pwsh
        run: ./scripts/Invoke-GrowthOsValidation.ps1