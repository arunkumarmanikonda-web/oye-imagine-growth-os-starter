name: production-activation-readiness

on:
  push:
    branches:
      - main
      - closeout-*
  pull_request:

jobs:
  production-activation-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: commercial evidence panel
        run: npx vitest run tests/lib/admin-ops-commercial-evidence-panel.test.tsx

      - name: operator action bridge panel
        run: npx vitest run tests/lib/admin-ops-operator-action-bridge-panel.test.tsx

      - name: admin ops runtime bridge
        run: npm run test:admin-ops-runtime-bridge

      - name: production activation suite
        run: npm run test:activation-production-suite

      - name: full validation suite
        run: npm run test:validation-full-suite

      - name: record validated commit
        run: echo "Production activation validation complete for $(git rev-parse --short HEAD)"
