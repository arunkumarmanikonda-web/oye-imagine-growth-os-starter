name: Workspace Branding Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace-branding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WORKSPACE_DISPLAY_NAME: Oye Imagine

      - name: Run workspace branding CI smoke
        run: npm run smoke:workspace-branding-ci
        env:
          NEXT_PUBLIC_WORKSPACE_DISPLAY_NAME: Oye Imagine